[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodot"
version = "0.2.1"
description = "A minimal, open-source AI assistant with persistent memory and proactive task execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
nanodot = "nanodot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
