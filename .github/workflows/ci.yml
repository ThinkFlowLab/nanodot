name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11: the floor stays exercised.
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (offline, all fakes)
        env:
          # Restrict offline enforcement to tests; checkout and installation
          # need network access. The autouse socket guard in conftest.py also
          # rejects direct network calls that do not honor proxy variables.
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: ""
        run: |
          # Actions env keys are case-insensitive; define lowercase aliases
          # in the shell so both spellings reach pytest and its subprocesses.
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY"
          export all_proxy="$ALL_PROXY" no_proxy="$NO_PROXY"
          python -m pytest -q
      - name: Review skill checks
        env:
          # The skill suite is network-free by contract; hold it to the same
          # dead-proxy enforcement as the main suite.
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: ""
        run: |
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY"
          export all_proxy="$ALL_PROXY" no_proxy="$NO_PROXY"
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s .agents/skills/nanodot-review/tests -v
