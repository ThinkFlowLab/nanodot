name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Networking is dead for the whole suite: every port is faked, and an
      # accidental real network call must fail loudly (issue #14: the suite
      # is the executable proof of the adapter seam).
      HTTP_PROXY: "http://127.0.0.1:9"
      HTTPS_PROXY: "http://127.0.0.1:9"
      ALL_PROXY: "http://127.0.0.1:9"
      NO_PROXY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (offline, all fakes)
        run: pytest -q
